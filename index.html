<style>

    --bg: #0f1115;
    --bg2: #161a22;
    --card: #1b2029;
    --card-hover: #232a37;
    --border: #262d3a;
    --text: #e8ecf3;
    --muted: #8b95a7;
    --accent: #4f8cff;
    --accent2: #7c5cff;
    --shadow: rgba(0,0,0,.4);
  }
  [data-theme="light"] {
    --bg: #f5f7fa;
    --bg2: #ffffff;
    --card: #ffffff;
    --card-hover: #f0f3f8;
    --border: #e3e8ef;
    --text: #1c2330;
    --muted: #6b7485;
    --shadow: rgba(30,50,90,.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background .3s, color .3s;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(12px);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1240px; margin: 0 auto; padding: 16px 20px;
    display: flex; align-items: center; gap: 16px;
  }
  .logo {
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .logo-badge {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px;
  }
  .logo h1 { font-size: 22px; font-weight: 700; letter-spacing: .3px; }
  .logo small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  .search-box { flex: 1; min-width: 200px; }
  .search-box input {
    width: 100%; padding: 11px 16px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); font-size: 14px; outline: none;
    transition: border .2s, box-shadow .2s;
  }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .theme-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
    font-size: 18px; flex-shrink: 0; transition: background .2s;
  }
  .theme-btn:hover { background: var(--card-hover); }
  main { max-width: 1240px; margin: 0 auto; padding: 24px 20px 60px; }
  .cat-nav {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px;
  }
  .cat-nav button {
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    padding: 7px 14px; border-radius: 20px; cursor: pointer; font-size: 13px;
    transition: all .2s;
  }
  .cat-nav button:hover { color: var(--text); background: var(--card-hover); }
  .cat-nav button.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border-color: transparent;
  }
  .section { margin-bottom: 36px; scroll-margin-top: 90px; }
  .section-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 18px; font-weight: 700; margin-bottom: 16px;
  }
  .section-title .icon { font-size: 20px; }
  .section-title .count { color: var(--muted); font-size: 12px; font-weight: 400; }
  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  }
  .card {
    position: relative; display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; text-decoration: none;
    color: var(--text); transition: all .18s;
    overflow: hidden;
  }
  .card:hover {
    background: var(--card-hover); transform: translateY(-3px);
    box-shadow: 0 8px 24px var(--shadow);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
  }
  .fav {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 600; color: #fff;
  }
  .card .info { min-width: 0; }
  .card .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .desc { font-size: 11px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { display: none; text-align: center; color: var(--muted); padding: 40px 0; }
  .empty.show { display: block; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; border-top: 1px solid var(--border); }
  @media (max-width: 640px) {
    .header-inner { flex-wrap: wrap; }
    .search-box { order: 3; flex-basis: 100%; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
</style>

    name: "出行生活", icon: "🗺️", color: "#0ea5e9",
    sites: [
      { name: "Google Maps", url: "https://maps.google.com", desc: "地图" },
      { name: "高德地图", url: "https://www.amap.com", desc: "国内地图" },
      { name: "百度地图", url: "https://map.baidu.com", desc: "国内地图" },
      { name: "猫途鹰", url: "https://www.tripadvisor.com", desc: "旅行点评" },
      { name: "Booking", url: "https://www.booking.com", desc: "酒店预订" },
      { name: "Airbnb", url: "https://www.airbnb.com", desc: "民宿" },
      { name: "12306", url: "https://www.12306.cn", desc: "铁路购票" },
      { name: "飞猪", url: "https://www.fliggy.com", desc: "旅行平台" }
    ]
  }
];

const $$ = s => document.querySelector(s);
const sectionsEl = $$('#sections');
const catNavEl = $$('#catNav');
const emptyEl = $$('#empty');
const searchEl = $$('#search');
const themeBtn = $$('#themeBtn');

let activeCat = null;

// 渲染分类导航
function renderNav() {
  catNavEl.innerHTML = '';
  const all = document.createElement('button');
  all.textContent = '全部';
  all.className = activeCat === null ? 'active' : '';
  all.addEventListener('click', () => { activeCat = null; applyFilter(); });
  catNavEl.appendChild(all);
  DATA.forEach((s, i) => {
    const b = document.createElement('button');
    b.textContent = `${s.icon} ${s.name}`;
    b.className = activeCat === i ? 'active' : '';
    b.addEventListener('click', () => { activeCat = i; applyFilter(); });
    catNavEl.appendChild(b);
  });
  // 重建导航高亮, 保持简单: 元素顺序即 index+1
}

// 渲染所有卡片
function renderSections(filter = '') {
  sectionsEl.innerHTML = '';
  let shown = 0;
  const kw = filter.trim().toLowerCase();
  DATA.forEach((s, si) => {
    if (activeCat !== null && si !== activeCat) return;
    // 过滤卡片
    let sites = s.sites;
    if (kw) {
      sites = sites.filter(x =>
        x.name.toLowerCase().includes(kw) ||
        x.desc.toLowerCase().includes(kw) ||
        s.name.toLowerCase().includes(kw)
      );
    }
    if (sites.length === 0) return;

    const sec = document.createElement('section');
    sec.className = 'section';
    const title = document.createElement('div');
    title.className = 'section-title';
    title.innerHTML = `<span class="icon">${s.icon}</span> ${s.name} <span class="count">${sites.length}</span>`;
    sec.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'grid';
    sites.forEach(x => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = x.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `
        <span class="fav" style="background:${s.color}">${s.icon}</span>
        <span class="info"><span class="name">${x.name}</span><span class="desc">${x.desc}</span></span>
      `;
      grid.appendChild(a);
      shown++;
    });
    sec.appendChild(grid);
    sectionsEl.appendChild(sec);
  });
  emptyEl.classList.toggle('show', shown === 0);
}

function applyFilter() {
  renderNav();
  renderSections(searchEl.value);
}

searchEl.addEventListener('input', () => applyFilter());

// 主题切换
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '🌙' : '☀️';
}
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(cur);
  try { localStorage.setItem('theme', cur); } catch (e) {}
});

// 初始化
(function init() {
  let t = 'dark';
  try { t = localStorage.getItem('theme') || 'dark'; } catch (e) {}
  applyTheme(t);
  applyFilter();
})();
</script>
</body>
</html>
